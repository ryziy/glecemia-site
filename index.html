.left{grid-column:1;justify-self:start;display:flex;flex-direction:column;gap:3px}
.lab{font-size:9px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}

.right{grid-column:3;justify-self:end}
.cartbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.hero{display:flex;justify-content:center;padding:48px 0 40px}

.card{cursor:pointer}
.img{aspect-ratio:4/5;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.card:hover .img{transform:translateY(-4px)}
.shape{width:46%;height:52%;border-radius:6px 6px 14px 14px;border:1px solid rgba(0,0,0,.15)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding-top:12px;font-size:15px}
.meta span:last-child{color:var(--mute);white-space:nowrap}
.old{position:relative;display:inline-block;color:var(--mute);margin-right:8px}
.scr{position:absolute;left:-4px;top:-2px;width:calc(100% + 8px);height:calc(100% + 4px);pointer-events:none;overflow:visible}
.new{color:var(--fg);font-weight:500}
.card.ltd .img{border-color:rgba(221,17,17,.45);box-shadow:0 0 16px 2px rgba(221,17,17,.22)}
.card.sold .img{opacity:.45}
.lim{margin-top:6px;font-size:12px;color:#c11;letter-spacing:.02em}
