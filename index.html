<style>

 $("list").innerHTML=h||'<div class="empty">Корзина пуста</div>';$("cnt").textContent=n;$("sum").textContent=money(sum);$("buy").disabled=!n;$("foot").style.display="";$("dt").textContent="Корзина"}

function nameOk(v){
 if(v.length<2||v.length>30)return false;
 if(!/^[A-Za-zА-Яа-яЁёІіЇїЄєҐґ'’ʼ\- ]+$/.test(v))return false;
